name: Java checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '25']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile with warnings treated as errors
        run: |
          mkdir -p out
          javac --release 17 -encoding UTF-8 -Xlint:all -Werror -d out src/*.java tests/*.java
      - name: Run regression tests
        run: java -cp out TriangleTest
      - name: Run example
        run: java -cp out Main 3 4 5
